name: CodeQL reusable

on:
  workflow_call:
    inputs:
      languages:
        description: Comma-separated CodeQL languages, e.g. "cpp" or "rust,c-cpp"
        required: true
        type: string
      build-command:
        description: Optional build command for compiled languages
        required: false
        type: string
        default: ''

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ inputs.languages }}
          queries: security-extended

      - name: Build (compiled languages)
        if: inputs.build-command != ''
        shell: pwsh
        run: ${{ inputs.build-command }}

      - name: Analyze
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: /language:${{ inputs.languages }}
